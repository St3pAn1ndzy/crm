name: CRM Continuous Integration (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_test_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: abatilo/actions-poetry@v3
      with:
        poetry-version: "2.4.1"

    - name: Install Dependencies
      working-directory: ./crm
      run: |
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-root

    - name: Run Static Analysis & Linting (Ruff)
      run: |
        ruff check .
        ruff format --check .

    - name: Run Django Automated Unit Tests
      working-directory: ./crm
      env:
        SECRET_KEY: "github-actions-ci-secret-key-super-secure-2026"
        DEBUG: "False"
        DATABASE_URL: "postgres://crm_user:crm_password@localhost:5432/crm_test_db"

        REDIS_URL: "redis://localhost:6379/1"
      run: |
        python crm/manage.py test tests
